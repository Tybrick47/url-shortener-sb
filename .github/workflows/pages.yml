name: Build and Deploy Site


on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: urlshortener
          MYSQL_USER: urlapp
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: url-shortener-sb/url-shortener-sb

    env:
      DB_PASSWORD: testpass
      JWT_SECRET: ci-test-secret-not-real-0123456789abcdefghijklmnopqrstuvwxyz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and make reports
        run: |
          chmod +x mvnw
          ./mvnw -B test javadoc:javadoc surefire-report:report-only -Ddoclint=none

      - name: Collect site files
        run: |
          mkdir -p site/javadoc site/tests
          cp -r src/main/html/. site/
          cp -r $(find target -type d -name apidocs | head -1)/* site/javadoc/
          cp $(find target -name "surefire*.html" | head -1) site/tests/surefire.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: url-shortener-sb/url-shortener-sb/site